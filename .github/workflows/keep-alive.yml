name: Keep Render alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SF Dashboard
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sf-dashboard-websg.onrender.com/)
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Unexpected status $STATUS"
            exit 1
          fi
